# Blueprint do Render — EvolFit Frontend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: evolfit-frontend
    runtime: static
    plan: free
    region: oregon # ou ohio, frankfurt, singapore — escolha o mais próximo do backend
    branch: main
    autoDeploy: true
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # definido manualmente no painel do Render (não versionar)
      - key: NODE_VERSION
        value: 20.11.1
      - key: PNPM_VERSION
        value: 9.12.0
    headers:
      # --- Segurança básica -------------------------------------------------
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

      # --- Cache ------------------------------------------------------------
      # Assets com hash no nome: cache agressivo (1 ano)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Ícone
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=604800
      # HTML: sempre revalidar (SPA — conteúdo muda a cada deploy)
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

    routes:
      # SPA fallback: qualquer rota desconhecida cai em index.html
      - type: rewrite
        source: /*
        destination: /index.html